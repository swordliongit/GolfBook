# Local MySQL 8 for development: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: golfbook
      MYSQL_USER: golfbook
      MYSQL_PASSWORD: golfbook
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
